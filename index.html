(()=>{const el=document.getElementById('root'),nav=document.getElementById('nav');let s={page:'quiz',step:0,answers:{goal:'Emagrecer',level:'Retornando',split:'Full Body',days:4,weekdays:[0,1,3,4],age:28,weight:95,height:177,pain:'Nenhuma',name:'Usuário Demo'},plan:0,selected:0,logs:[],draft:{},favorites:[],weights:[],done:[]};const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(t,action,cl='')=>`<button class="btn ${cl}" data-act="${action}">${t}</button>`;const heading=(a,b)=>`<div class="eyebrow">${a}</div><div class="title">${b}</div>`;const pic=x=>x?.image||'';const groups=['Pernas e glúteos','Costas','Peito','Ombros e braços','Abdômen e core','Cardio'];const byGroup=(g,count)=>EXERCISES.filter(e=>e.group===g).slice(0,count);function plan(){
  if(s.answers.split==='Full Body'){
    // Every day covers the whole body, with distinct exercises rather than a rotated identical list.
    const day=((Number(s.plan)||0)%5+5)%5;
    const pick=(g,ordinal)=>{
      const all=EXERCISES.filter(e=>e.group===groups[g]);
      return all.length?all[ordinal%all.length]:null;
    };
    const routine=[
      // 2 lower, 1 chest, 1 back, 2 arm/shoulder, 1 core, 1 cardio
      [[0,0],[0,2],[2,0],[1,0],[3,0],[3,3],[4,0],[5,0]],
      [[0,1],[0,6],[2,2],[1,3],[3,1],[3,6],[4,1],[5,1]],
      [[0,3],[0,8],[2,1],[1,1],[3,2],[3,4],[4,2],[5,2]],
      [[0,4],[0,10],[2,3],[1,4],[3,5],[3,7],[4,3],[5,3]],
      [[0,5],[0,9],[2,4],[1,5],[3,0],[3,7],[4,4],[5,4]]
    ];
    return routine[day].map(([g,index])=>pick(g,index)).filter(Boolean);
  }
